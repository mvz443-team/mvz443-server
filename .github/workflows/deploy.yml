name: Deploy to GitHub Releases

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout server
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout protobuf contracts
        uses: actions/checkout@v4
        with:
          repository: mvz443-team/protos
          path: contracts
          token: ${{ secrets.PROTO_REPO_TOKEN || github.token }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup protobuf tools
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest

      - name: Generate protobuf contracts
        run: make proto
        env:
          PROTO_REPO_DIR: ${{ github.workspace }}/contracts

      - name: Build release binaries
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist

          build() {
            local goos="$1"
            local goarch="$2"
            local ext="${3:-}"
            local output="dist/mvzserver_${goos}_${goarch}${ext}"

            echo "Building ${output}"
            CGO_ENABLED=0 GOOS="${goos}" GOARCH="${goarch}" go build -trimpath -ldflags="-s -w" -o "${output}" .
          }

          build linux amd64
          build linux 386
          build windows amd64 .exe
          build windows 386 .exe

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/mvzserver_linux_amd64
            dist/mvzserver_linux_386
            dist/mvzserver_windows_amd64.exe
            dist/mvzserver_windows_386.exe
